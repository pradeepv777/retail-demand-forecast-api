name: CD

# Runs only on pushes to main, after CI has already passed.
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t rossmann-api:latest .

      # ── Save image as a tarball and copy to EC2 ──────────────────────────
      # This approach avoids needing a container registry (ECR / Docker Hub).
      # The image is built here, saved to a .tar, SCP'd to the EC2 instance,
      # loaded there, and the container is restarted.
      #
      # Required GitHub Secrets:
      #   EC2_HOST       — public IP or DNS of your EC2 instance
      #   EC2_USER       — SSH username
      #   EC2_SSH_KEY    — contents of your .pem private key file

      - name: Save Docker image to tarball
        run: docker save rossmann-api:latest | gzip > rossmann-api.tar.gz

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Copy image to EC2
        run: |
          scp -i ec2_key.pem \
            -o StrictHostKeyChecking=no \
            rossmann-api.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/rossmann-api.tar.gz

      # ── Deploy on EC2 ────────────────────────────────────────────────────
      # The model files and training CSV remain on EC2 and are bind-mounted
      # into the container so they persist across deployments.
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Load the new image
            docker load < ~/rossmann-api.tar.gz

            # Stop and remove the old container if running
            docker stop rossmann-api 2>/dev/null || true
            docker rm rossmann-api 2>/dev/null || true

            # Start the new container
            # Model files and CSVs are bind-mounted from the host.
            docker run -d \
              --name rossmann-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -v ~/rossmann/models:/app/models:ro \
              -v ~/rossmann/Data:/app/Data:ro \
              rossmann-api:latest

            # Wait for the API to become ready.
            # The application loads the training data and models during startup,
            # so allow up to 60 seconds instead of checking only once after 5 seconds.
            for i in {1..12}; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for API startup... ($i/12)"
              sleep 5
            done

            echo "Health check failed after 60 seconds"
            docker logs rossmann-api
            exit 1

      # ── Clean up ─────────────────────────────────────────────────────────
      - name: Clean up SSH key
        if: always()
        run: rm -f ec2_key.pem
