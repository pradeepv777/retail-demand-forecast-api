name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rossmann-api .

      - name: Start container in smoke-test mode
        run: |
          docker run -d \
            --name rossmann-api \
            -p 8000:8000 \
            -e SMOKE_TEST=true \
            rossmann-api

      - name: Wait for app to be ready
        run: |
          echo "Waiting for API to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up."
              exit 0
            fi
            echo "Attempt $i/15 — not ready yet, waiting 2s..."
            sleep 2
          done
          echo "API did not start in time. Container logs:"
          docker logs rossmann-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v

      - name: Print container logs on failure
        if: failure()
        run: docker logs rossmann-api

      - name: Tear down container
        if: always()
        run: docker rm -f rossmann-api
